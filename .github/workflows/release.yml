name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
            - name: Verify release metadata
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node -e 'const manifest = require("./manifest.json"); const versions = require("./versions.json"); if (process.env.RELEASE_TAG !== manifest.version || versions[manifest.version] !== manifest.minAppVersion) { console.error("Tag must match manifest version and versions.json must map it to minAppVersion"); process.exit(1); }'
            - name: Install dependencies
              run: npm ci --include=dev --no-audit --no-fund --cache "$RUNNER_TEMP/npm-release-cache"
            - name: Verify build tools
              run: test -x node_modules/.bin/lessc && test -x node_modules/.bin/tsc
            - name: Build plugin
              run: npm run build
            - name: Generate artifact attestation
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft main.js manifest.json styles.css